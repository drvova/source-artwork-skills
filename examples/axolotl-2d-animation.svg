<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="312" height="266" viewBox="-14 -4 342 292" role="img" aria-labelledby="title desc">
  <title id="title">Pixel-cell axolotl</title>
  <desc id="desc">A warm-toned pixel-cell axolotl with upright orange gills, dark eyes, a pale face, and splayed limbs.</desc>
  <style>
    .swim-cycle { transform-box: view-box; transform-origin: 156px 133px; animation: body-sway 2s ease-in-out infinite; }
    .part { transform-box: view-box; animation-duration: 2s; animation-iteration-count: infinite; animation-timing-function: ease-in-out; }
    .gill-left-upper { animation-name: gill-left-upper; }
    .gill-left-side { animation-name: gill-left-side; }
    .gill-left-inner { animation-name: gill-left-inner; }
    .gill-right-upper { animation-name: gill-right-upper; }
    .gill-right-side { animation-name: gill-right-side; }
    .limb-left { animation-name: limb-left; }
    .limb-right { animation-name: limb-right; }
    .eyes { animation-name: blink; animation-timing-function: linear; }
    @keyframes body-sway { 0%,100% { transform: translateY(2px) rotate(0deg); } 50% { transform: translateY(-2px) rotate(-0.6deg); } }
    @keyframes gill-left-upper { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-8deg); } }
    @keyframes gill-left-side { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(7deg); } }
    @keyframes gill-left-inner { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-6deg); } }
    @keyframes gill-right-upper { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(7deg); } }
    @keyframes gill-right-side { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-7deg); } }
    @keyframes limb-left { 0%,100% { transform: rotate(0deg); } 25% { transform: rotate(-12deg); } 50% { transform: rotate(2deg); } 75% { transform: rotate(10deg); } }
    @keyframes limb-right { 0%,100% { transform: rotate(0deg); } 25% { transform: rotate(10deg); } 50% { transform: rotate(-2deg); } 75% { transform: rotate(-12deg); } }
    @keyframes blink { 0%,46%,52%,96%,100% { transform: scaleY(1); } 48%,50% { transform: scaleY(0.12); } }
    @media (prefers-reduced-motion: reduce) { .swim-cycle, .part { animation: none !important; } }
  </style>
