  <style>
    .jelly-bell { transform-box:view-box; transform-origin:160px 136px; animation:pulse 1.2s ease-in-out infinite; }
    .tentacle { transform-box:view-box; }
    .tentacle-1,.tentacle-2 { animation:sway-left 2.4s ease-in-out infinite; }
    .tentacle-3,.tentacle-4 { animation:sway-right 2.4s ease-in-out infinite; }
    .tentacle-2,.tentacle-4 { animation-delay:-.3s; }
    @keyframes pulse { 0%,100% { transform:scaleY(1); } 50% { transform:scaleY(.88); } }
    @keyframes sway-left { 0%,100% { transform:translateX(0); } 50% { transform:translateX(-8px); } }
    @keyframes sway-right { 0%,100% { transform:translateX(0); } 50% { transform:translateX(8px); } }
    @media (prefers-reduced-motion:reduce) { .jelly-bell,.tentacle { animation:none; } }
  </style>
